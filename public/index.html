<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Shayken</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<main>
			<h1>Shayken</h1>

			<section id="lobby">
				<button id="create-btn">Create room</button>
				<p>or</p>
				<form id="join-form">
					<input id="code-input" placeholder="Room code" maxlength="6" autocomplete="off" />
					<button type="submit">Join</button>
				</form>
			</section>

			<section id="game" hidden>
				<p>Room <strong id="room-code"></strong> · You are <strong id="seat"></strong></p>
				<p id="opponent"></p>
				<h2>Your hand</h2>
				<div id="hand"></div>
				<p id="deck-count"></p>
			</section>

			<p id="status"></p>
		</main>
		<script type="module" src="/main.js"></script>
	</body>
</html>

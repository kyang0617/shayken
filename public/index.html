<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Shayken</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<main>
			<h1>Shayken</h1>

			<section id="lobby">
				<button id="create-btn">Create room</button>
				<p>or</p>
				<form id="join-form">
					<input id="code-input" placeholder="Room code" maxlength="6" autocomplete="off" />
					<button type="submit">Join</button>
				</form>
			</section>

			<section id="game" hidden>
				<p>Room <strong id="room-code"></strong> · You are <strong id="seat"></strong></p>
				<p id="turn"></p>
				<p id="last-throw"></p>

				<div class="panel">
					<h2>Opponent</h2>
					<p id="opp-stats"></p>
					<h3>Brew <span id="opp-brew-dmg"></span></h3>
					<div id="opp-brew" class="row small brew"></div>
					<h3>Powers</h3>
					<div id="opp-powers" class="row small"></div>
				</div>

				<div class="panel">
					<h2>You</h2>
					<p id="my-stats"></p>
					<h3>Brew <span id="my-brew-dmg"></span></h3>
					<div id="my-brew" class="row small brew"></div>
					<h3>Powers</h3>
					<div id="my-powers" class="row small"></div>
					<h3>Hand</h3>
					<div id="hand" class="row"></div>
					<div class="actions">
						<button id="end-turn-btn">End turn (hold brew)</button>
						<button id="throw-btn">Throw &amp; end turn</button>
						<button id="concede-btn">Concede</button>
					</div>
				</div>
			</section>

			<p id="status"></p>

			<div id="result" class="overlay" hidden>
				<div class="result-card">
					<h2 id="result-title"></h2>
					<p id="result-detail"></p>
					<div id="result-brew" class="row small brew"></div>
					<p id="result-stats"></p>
					<p id="result-closed" hidden>This room has closed.</p>
					<div class="actions">
						<button id="result-lobby">Back to lobby</button>
						<button id="result-close">View board</button>
					</div>
				</div>
			</div>
		</main>
		<script type="module" src="/main.js"></script>
	</body>
</html>
